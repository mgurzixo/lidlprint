// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.9.2'
        classpath 'com.google.gms:google-services:4.4.4'
        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
}

// AS on this machine supports max AGP 8.9.2; `cap sync` regenerates
// capacitor-cordova-android-plugins/build.gradle with a newer AGP — the
// Makefile pins it back after every sync, and this force covers leftovers.
subprojects {
    buildscript {
        repositories {
            google()
            mavenCentral()
        }
        dependencies {
            classpath 'com.android.tools.build:gradle:8.9.2'
        }
        configurations.classpath {
            resolutionStrategy {
                force 'com.android.tools.build:gradle:8.9.2'
            }
        }
    }
}

apply from: "variables.gradle"

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}
